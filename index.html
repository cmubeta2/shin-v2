<!DOCTYPE html>
<html lang="vi" data-theme="light" data-palette="executive" data-cochu="vua">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SHIN AIOS v2 – Hệ thống điều hành hợp nhất đa module dành cho Doanh nghiệp & Y tế">
  <meta name="theme-color" content="#0284c7">
  <title>SHIN AIOS v2 – Hệ Thống Hợp Nhất Đa Module</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Chống chớp giao diện (Anti-Flicker Script)
    (function() {
      try {
        var t = localStorage.getItem('shin_theme');
        var p = localStorage.getItem('shin_palette');
        var c = localStorage.getItem('shin_cochu');
        if (t) document.documentElement.setAttribute('data-theme', t);
        if (p) document.documentElement.setAttribute('data-palette', p);
        if (c) document.documentElement.setAttribute('data-cochu', c);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Thanh Header Đỉnh Ghim (Sticky Topbar) -->
  <header class="topbar">
    <div style="display:flex; align-items:center; gap:8px; min-width:0;">
      <button class="btn-icon" onclick="ShinApp.moDecagonDrawer()" title="Danh mục 10 Mảng">
        ☰
      </button>
      <a href="#" class="topbar-brand" onclick="ShinApp.chuyenModule('hub'); return false;">
        <div class="topbar-logo">
          <svg viewBox="0 0 100 100" width="24" height="24">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="190 30" />
            <path d="M 32 68 L 46 32 L 54 32 L 68 68 L 58 68 L 54 56 L 46 56 L 42 68 Z M 48 44 L 52 44 L 50 38 Z" fill="#fff" />
            <circle cx="50" cy="22" r="5" fill="#facc15" />
          </svg>
        </div>
        <div class="topbar-titles">
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="topbar-title">SHIN AIOS</span>
            <!-- Thẻ trạng thái nhỏ gọn nằm ngay kế bên chữ SHIN AIOS -->
            <button class="header-status-pill demo" id="headerStatusPill" onclick="ShinApp.moCaiDat(); event.stopPropagation();" title="Bấm để quản lý kết nối Token">
              Live v2.1.0
            </button>
          </div>
          <div class="topbar-sub">Hệ thống Quản trị AI</div>
        </div>
      </a>
    </div>

    <!-- Phía bên phải gom lại chỉ còn DUY NHẤT 1 nút nhấn tia sét ⚡ -->
    <div class="topbar-actions">
      <button class="btn-icon" onclick="ShinApp.chuyenModule('pheduyet')" title="Hộp thư Phê duyệt 1-chạm" style="position:relative;">
        ⚡
        <span class="badge-count" id="countPendingApproval" style="position:absolute; top:-2px; right:-2px;">4</span>
      </button>
    </div>
  </header>

  <!-- Vùng Nội Dung Chính (Main Content Container) -->
  <main class="main-container" id="appContent" role="main">
    <!-- Được render linh hoạt theo Module đã chọn -->
  </main>

  <!-- Thanh Điều Hướng Đáy Ghim (Fixed Bottom Navigation) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Thanh điều hướng chính">
    <!-- Sinh động qua js/app.js -->
  </nav>

  <!-- Khung Chứa Toast Thông Báo Có Hoàn Tác 6s -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- DECAGON DRAWER: THẬP DIỆN KIẾN TRÚC (10 MẢNG NGHIỆP VỤ) -->
  <div class="decagon-overlay" id="decagonOverlay" onclick="ShinApp.dongDecagonDrawer()"></div>
  <div class="decagon-drawer" id="decagonDrawer" aria-label="Bảng điều hướng 10 Mảng Decagon">
    <div class="decagon-head">
      <div>
        <div style="font-weight:800; font-size:15px; color:var(--text);">DANH MỤC NGHIỆP VỤ</div>
        <div style="font-size:11px; color:var(--text-muted);">Hệ thống Quản trị AI</div>
      </div>
      <button class="btn-icon" style="background:transparent; border:none; color:var(--text);" onclick="ShinApp.dongDecagonDrawer()">✕</button>
    </div>

    <div class="decagon-body" id="decagonBody">
      <!-- Sinh động qua js/app.js theo 3 cụm chuẩn Sếp duyệt -->
    </div>
  </div>

  <!-- Modal Cài Đặt Giao Diện & Kết Nối Token -->
  <div class="modal-overlay" id="settingsModal" onclick="if (event.target === this) ShinApp.dongModal();">
    <div class="modal-sheet">
      <div class="modal-head">
        <div class="modal-title">⚙️ Cài Đặt & Giao Diện</div>
        <button class="btn-icon" style="background:transparent; border:none; color:var(--text);" onclick="ShinApp.dongModal()">✕</button>
      </div>

      <!-- Chế độ Hiển Thị (Sáng / Tối / Theo máy / Theo giờ) theo chỉ đạo của Sếp -->
      <div class="form-group" style="margin-bottom:18px;">
        <label class="form-label">CHẾ ĐỘ HIỂN THỊ (THEME MODE)</label>
        <div class="theme-mode-grid" id="themeModeGrid">
          <button class="theme-mode-btn" data-mode="light" onclick="ShinApp.chonThemeMode('light')">
            <span class="theme-mode-icon">☀️</span>
            <span class="theme-mode-text">Sáng</span>
          </button>
          <button class="theme-mode-btn" data-mode="dark" onclick="ShinApp.chonThemeMode('dark')">
            <span class="theme-mode-icon">🌙</span>
            <span class="theme-mode-text">Tối</span>
          </button>
          <button class="theme-mode-btn" data-mode="system" onclick="ShinApp.chonThemeMode('system')">
            <span class="theme-mode-icon">💻</span>
            <span class="theme-mode-text">Theo máy</span>
          </button>
          <button class="theme-mode-btn" data-mode="auto" onclick="ShinApp.chonThemeMode('auto')">
            <span class="theme-mode-icon">⏰</span>
            <span class="theme-mode-text">Theo giờ</span>
          </button>
        </div>
      </div>

      <!-- Chọn 8 Phong Cách -->
      <div class="form-group">
        <label class="form-label">8 PHONG CÁCH GIAO DIỆN (MA TRẬN MÀU SẮC)</label>
        <div class="palette-grid" id="paletteGrid">
          <!-- Sinh động qua js/app.js -->
        </div>
      </div>

      <!-- Quản Lý Token Kết Nối Apps Script Thật -->
      <div class="form-group" style="margin-top:20px; border-top:1px dashed var(--border); padding-top:16px;">
        <label class="form-label" for="tokenInput">🔑 KẾT NỐI DỮ LIỆU THẬT (TOKEN HUB)</label>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">
          Dán token ký HMAC dạng <code>h1.&lt;mã&gt;.0.&lt;chữ_ký&gt;</code> để kết nối trực tiếp với file Google Sheets & máy chủ Apps Script. Bỏ trống để dùng chế độ Trình diễn mẫu (Demo).
        </p>
        <input type="text" id="tokenInput" class="form-input" placeholder="Ví dụ: h1.13151.0.abcxyz..." autocomplete="off">
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn-primary" style="flex:1;" onclick="ShinApp.luuCaiDatToken()">Lưu Kết Nối</button>
          <button class="btn-secondary" onclick="document.getElementById('tokenInput').value=''; ShinApp.luuCaiDatToken();">Chạy Mẫu (Demo)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: Nạp Dữ Liệu Demo, Tầng API và Toàn Bộ 10 Mảng Module -->
  <script src="js/demo_data.js"></script>
  <script src="js/api.js"></script>
  <!-- Các Module Nghiệp Vụ -->
  <script src="js/modules/hub.js"></script>
  <script src="js/modules/kpi.js"></script>
  <script src="js/modules/khaosat.js"></script>
  <script src="js/modules/crm.js"></script>
  <script src="js/modules/tuyensinh.js"></script>
  <script src="js/modules/phongkham.js"></script>
  <script src="js/modules/duan.js"></script>
  <script src="js/modules/congviec.js"></script>
  <script src="js/modules/pheduyet.js"></script>
  <script src="js/modules/trithuc.js"></script>
  <script src="js/modules/caidat_module.js"></script>
  <!-- Bộ Não Ứng Dụng Trung Tâm -->
  <script src="js/app.js"></script>
</body>
</html>
