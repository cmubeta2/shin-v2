<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>SHIN – Mất mạng</title>
<style>
  :root {
    --bg: #f4f5f7;
    --bg-card: #ffffff;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --c-chinh: #0f766e;
    --c-chu-nut: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0d12;
      --bg-card: #161a26;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #25293a;
      --c-chinh: #14b8a6;
      --c-chu-nut: #0c0d12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  .the {
    max-width: 420px;
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
  }
  .bieu { font-size: 48px; line-height: 1; margin-bottom: 6px; }
  h1 { font-size: 20px; font-weight: 700; margin: 12px 0 8px; }
  p { margin: 0 0 12px; color: var(--text-muted); font-size: 15px; line-height: 1.5; }
  .huong-dan { font-size: 14px; opacity: 0.9; }
  button {
    min-height: 44px;
    min-width: 44px;
    padding: 12px 20px;
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    background: var(--c-chinh);
    color: var(--c-chu-nut);
    cursor: pointer;
    width: 100%;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--c-chinh); outline-offset: 2px; }
</style>
</head>
<body>
  <main class="the">
    <div class="bieu" aria-hidden="true">📴</div>
    <h1>Chưa có mạng</h1>
    <p>Máy đang mất kết nối và chưa lưu sẵn SHIN v2 lần nào. Bật 4G / Wi-Fi rồi thử lại.</p>
    <p class="huong-dan">Lần sau khi mở được một lần có mạng, SHIN sẽ tự động lưu vỏ app để anh mở được ngay cả khi mất mạng.</p>
    <button type="button" onclick="location.reload()" aria-label="Thử kết nối lại">↻ Thử lại</button>
  </main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
